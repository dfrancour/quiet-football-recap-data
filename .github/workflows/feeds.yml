name: feeds

# Rebuilds the recap feeds (src/feeds/) from the season files and serves
# them from GitHub Pages, after every push the publisher makes. A change to
# the publisher or the sources it reads changes no feed, so it builds none.
# A build that changes nothing served is not deployed: Pages dates every
# file by its deploy, so a needless one makes every reader download every
# feed again. Once deployed, it tells the WebSub hub which feeds changed,
# so readers subscribed through it hear at once (src/feeds/served.ts). A
# manual run deploys regardless.

on:
  push:
    branches: [main]
    paths:
      - "nfl/*.json"
      - "src/**"
      - "!src/publisher/**"
      - "!src/sources/**"
      - "!src/check.ts"
      - "package-lock.json"
      - ".github/workflows/feeds.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A push that lands mid-deploy waits, and only the
# newest waiting one runs: each build is the whole site, so it supersedes
# the rest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.feeds.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch' }}
      hub: ${{ steps.feeds.outputs.hub }}
      feeds: ${{ steps.feeds.outputs.feeds }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Compared with what is served now, before a deploy replaces it.
      - id: feeds
        run: node src/cli.ts feeds --out _site --base-url "${{ steps.pages.outputs.base_url }}/" --changed "$GITHUB_OUTPUT"
      - if: steps.feeds.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # A failed ping costs only speed (readers still poll), so it fails
      # nothing, but shows.
      - name: Ping the hub with the feeds that changed
        if: needs.build.outputs.feeds != ''
        continue-on-error: true
        env:
          HUB: ${{ needs.build.outputs.hub }}
          FEEDS: ${{ needs.build.outputs.feeds }}
        run: |
          for feed in $FEEDS; do
            curl -fsS --retry 3 -d hub.mode=publish --data-urlencode "hub.url=$feed" "$HUB"
            echo "pinged $feed"
          done
