name: feeds

# Rebuilds the recap feeds (src/feeds.ts) from the season files and serves
# them from GitHub Pages, after every push the publisher makes.

on:
  push:
    branches: [main]
    paths:
      - "nfl/*.json"
      - "src/**"
      - "package-lock.json"
      - ".github/workflows/feeds.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A push that lands mid-deploy waits, and only the
# newest waiting one runs: each build is the whole site, so it supersedes
# the rest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: node src/cli.ts feeds --out _site --base-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
